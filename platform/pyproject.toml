[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsfs"
version = "1.0.0"
description = "Shared kernel for a 16-project full-stack data science portfolio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aniket Anil Naik" }]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
# Gradient boosting stack. Needs Python <=3.12 wheels; see docs/PYTHON_VERSIONS.md
boost = ["lightgbm>=4.3", "xgboost>=2.0", "catboost>=1.2"]
# Explainability and tuning
xai = ["shap>=0.45", "optuna>=3.6"]
# Finance / time series projects
ts = ["yfinance>=0.2", "statsmodels>=0.14"]
dev = ["pytest>=8.0", "playwright>=1.44"]

[tool.setuptools]
packages = ["dsfs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
